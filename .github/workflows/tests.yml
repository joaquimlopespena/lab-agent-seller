name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Bootstrap Sail
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          sed -i \
            -e 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' \
            -e 's/^# DB_HOST=.*/DB_HOST=pgsql/' \
            -e 's/^# DB_PORT=.*/DB_PORT=5432/' \
            -e 's/^# DB_DATABASE=.*/DB_DATABASE=laravel/' \
            -e 's/^# DB_USERNAME=.*/DB_USERNAME=sail/' \
            -e 's/^# DB_PASSWORD=.*/DB_PASSWORD=password/' \
            -e 's/^REDIS_HOST=.*/REDIS_HOST=redis/' \
            .env
          vendor/bin/sail up -d --wait
          vendor/bin/sail artisan key:generate --no-interaction
          vendor/bin/sail npm ci

      - name: Run CI Checks via Sail
        run: vendor/bin/sail composer ci:check

      - name: Stop Sail
        if: always()
        run: vendor/bin/sail down -v
